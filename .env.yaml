# Oryx ORM Environment Configuration (YAML)
# This file supports variable substitution using ${VAR_NAME} syntax
#
# Priority order (highest to lowest):
#   1. Actual system environment variables ($_ENV, $_SERVER)
#   2. .env file (legacy KEY=VALUE format, if present)
#   3. .env.yaml (this file - primary configuration)
#   4. .env.dist (template defaults)
#
# Variable substitution syntax:
#   ${VAR}            - Reference another variable
#   ${VAR:-default}   - Use default if VAR is not set
#   ${VAR:?error}     - Throw error if VAR is not set

# ─────────────────────────────────────────────
# Database Configuration
# ─────────────────────────────────────────────
database:
  host: ${DB_HOST:-localhost}
  port: ${DB_PORT:-3306}
  name: ${DB_NAME:-orm_db}
  user: ${DB_USER:-root}
  password: ${DB_PASSWORD:-}
  charset: ${DB_CHARSET:-utf8mb4}
  driver: ${DB_DRIVER:-pdo_sqlite}
  path: ${DB_PATH:-var/data/orm.db}

# ─────────────────────────────────────────────
# Application Settings
# ─────────────────────────────────────────────
app:
  env: ${APP_ENV:-dev}
  debug: ${APP_DEBUG:-true}
  secret: ${APP_SECRET:-change-me-in-production}

# ─────────────────────────────────────────────
# ORM / Doctrine Settings
# ─────────────────────────────────────────────
orm:
  auto_generate_proxy: ${ORM_AUTO_GENERATE_PROXY:-false}
  proxy_dir: ${ORM_PROXY_DIR:-/tmp/orm/proxies}
  proxy_namespace: ${ORM_PROXY_NAMESPACE:-Oryx\\ORM\\Proxy}

# ─────────────────────────────────────────────
# Cache Configuration
# ─────────────────────────────────────────────
cache:
  driver: ${CACHE_DRIVER:-array}
  host: ${CACHE_HOST:-localhost}
  port: ${CACHE_PORT:-11211}
  ttl: ${CACHE_TTL:-3600}

# ─────────────────────────────────────────────
# Rate Limiting (Memcached)
# ─────────────────────────────────────────────
rate_limit:
  enabled: ${RATE_LIMIT_ENABLED:-true}
  max_requests: ${RATE_LIMIT_MAX_REQUESTS:-60}
  window_seconds: ${RATE_LIMIT_WINDOW:-60}
  memcached_host: ${MEMCACHED_HOST:-localhost}
  memcached_port: ${MEMCACHED_PORT:-11211}

# ─────────────────────────────────────────────
# Mailer Settings
# ─────────────────────────────────────────────
mailer:
  transport: ${MAILER_TRANSPORT:-smtp}
  host: ${MAILER_HOST:-localhost}
  port: ${MAILER_PORT:-25}
  user: ${MAILER_USER:-}
  password: ${MAILER_PASSWORD:-}
